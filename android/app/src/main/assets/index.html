<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Hand Commands</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070a;color:#fff;font-family:system-ui}#camera,#overlay{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}#camera{transform:scaleX(-1)}#overlay{transform:scaleX(-1);pointer-events:none}#state{position:fixed;top:16px;left:16px;z-index:5;padding:10px 14px;border:1px solid #ffffff22;border-radius:999px;background:#05070acc;color:#61dcff;font-size:12px}#aim{position:fixed;z-index:6;width:42px;height:42px;border:2px solid #61dcff;border-radius:50%;transform:translate(-50%,-50%);display:none;pointer-events:none}#aim:after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;background:#61dcff;transform:translate(-50%,-50%)}#ring{position:absolute;inset:-5px;border:3px solid transparent;border-top-color:#61dcff;border-radius:50%;transform:rotate(-45deg)}#start{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#05070a}.card{text-align:center;padding:28px;max-width:420px}button{padding:14px 20px;border-radius:12px;border:1px solid #61dcff;background:transparent;color:#61dcff;font-weight:700}</style></head><body><video id="camera" playsinline muted></video><canvas id="overlay"></canvas><div id="state">CAMERA OFF</div><div id="aim"><div id="ring"></div></div><div id="start"><div class="card"><h1>HAND COMMANDS</h1><p>Point. Hold on small targets. Knock to click.</p><button id="startBtn">START FRONT CAMERA</button></div></div><script type="module" src="./main.js"></script></body></html>
